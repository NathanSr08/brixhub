<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BrixHub &bull; Réinitialisation de mot de passe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: '#0a0d14',
                        surface: '#121824',
                        card: '#182032',
                        accent: '#3b82f6'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark text-slate-200 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-sm sm:max-w-md bg-surface border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-blue-600 via-indigo-500 to-purple-600"></div>
        
        <div class="text-center space-y-1.5 mb-6">
            <div class="w-10 h-10 sm:w-12 sm:h-12 bg-indigo-600/20 text-indigo-400 rounded-xl mx-auto flex items-center justify-center text-lg sm:text-xl font-bold shadow-lg shadow-indigo-500/10">
                <i class="fa-solid fa-key"></i>
            </div>
            <h1 class="text-xl sm:text-2xl font-extrabold text-white">Nouveau mot de passe</h1>
            <p class="text-xs text-slate-400">Définissez vos nouveaux identifiants sécurisés</p>
        </div>

        <div id="statusAlert" class="hidden text-xs p-3 rounded-xl border flex items-center gap-2 mb-4 font-medium"></div>

        <form id="resetForm" class="space-y-4 text-xs">
            <div>
                <label class="block text-slate-400 mb-1 font-medium">Nouveau mot de passe (min. 6 caractères)</label>
                <input type="password" id="newPass" minlength="6" required placeholder="••••••••"
                       class="w-full px-3.5 py-2.5 bg-dark border border-slate-700 rounded-xl text-white text-xs sm:text-sm focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-slate-400 mb-1 font-medium">Confirmer le mot de passe</label>
                <input type="password" id="confirmPass" minlength="6" required placeholder="••••••••"
                       class="w-full px-3.5 py-2.5 bg-dark border border-slate-700 rounded-xl text-white text-xs sm:text-sm focus:outline-none focus:border-indigo-500">
            </div>

            <button type="submit" id="submitBtn" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-semibold text-xs sm:text-sm transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/30">
                <span>Mettre à jour le mot de passe</span> <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-500">
            <a href="/" class="hover:text-slate-300 transition"><i class="fa-solid fa-arrow-left mr-1"></i>Retour à l'accueil</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        const alertBox = document.getElementById('statusAlert');
        if (!token) {
            alertBox.className = "text-xs p-3 rounded-xl border flex items-center gap-2 mb-4 font-medium bg-red-500/10 text-red-400 border-red-500/20";
            alertBox.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> <span>Jeton de réinitialisation manquant ou invalide.</span>';
            alertBox.classList.remove('hidden');
            document.getElementById('resetForm').classList.add('hidden');
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const p1 = document.getElementById('newPass').value;
            const p2 = document.getElementById('confirmPass').value;
            const btn = document.getElementById('submitBtn');

            if (p1 !== p2) {
                alertBox.className = "text-xs p-3 rounded-xl border flex items-center gap-2 mb-4 font-medium bg-red-500/10 text-red-400 border-red-500/20";
                alertBox.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> <span>Les deux mots de passe ne correspondent pas.</span>';
                alertBox.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mise à jour...';

            try {
                const res = await fetch('/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, new_password: p1 })
                });
                const data = await res.json();

                if (res.ok) {
                    alertBox.className = "text-xs p-3 rounded-xl border flex items-center gap-2 mb-4 font-medium bg-emerald-500/10 text-emerald-400 border-emerald-500/20";
                    alertBox.innerHTML = '<i class="fa-solid fa-circle-check"></i> <span>Mot de passe mis à jour ! Redirection vers l\'accueil...</span>';
                    alertBox.classList.remove('hidden');
                    document.getElementById('resetForm').classList.add('hidden');
                    setTimeout(() => window.location.href = '/', 2000);
                } else {
                    alertBox.className = "text-xs p-3 rounded-xl border flex items-center gap-2 mb-4 font-medium bg-red-500/10 text-red-400 border-red-500/20";
                    alertBox.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> <span>${data.detail || 'Erreur'}</span>`;
                    alertBox.classList.remove('hidden');
                }
            } catch (err) {
                alertBox.className = "text-xs p-3 rounded-xl border flex items-center gap-2 mb-4 font-medium bg-red-500/10 text-red-400 border-red-500/20";
                alertBox.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> <span>Erreur réseau</span>';
                alertBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>Mettre à jour le mot de passe</span> <i class="fa-solid fa-arrow-right"></i>';
            }
        });
    </script>
</body>
</html>
